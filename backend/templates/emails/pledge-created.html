<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { font-family: Arial, sans-serif; color: #2C3E50; }
  .header { background: #27AE60; color: white; padding: 20px; }
  .body { padding: 24px; }
  .footer { padding: 16px 24px; color: #95A5A6; font-size: 12px; border-top: 1px solid #eee; }
</style></head>
<body>
  <div class="header"><h2>BloodLink — A Donor Has Responded!</h2></div>
  <div class="body">
    <p>Hello {{seekerName}},</p>
    <p>Great news! A donor has accepted the blood request for patient <strong>{{patientName}}</strong>.</p>
    <p>Log in to <a href="{{dashboardUrl}}">your dashboard</a> to view the donor's contact details and coordinate with the hospital.</p>
  </div>
  <div class="footer">BloodLink — Connecting donors with those in need.</div>
</body>
</html>
